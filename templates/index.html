<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>📅 Today in History</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: #000000;
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
        }
        .container { max-width: 580px; margin: 0 auto; padding: 10px 0 30px; }

        .header {
            text-align: center;
            padding: 30px 20px 25px;
            margin-bottom: 30px;
            border-bottom: 3px solid #FFD700;
        }
        .header h1 {
            font-size: 2.2em;
            font-weight: 900;
            letter-spacing: 6px;
            color: #FFD700;
            text-transform: uppercase;
        }
        .header .date {
            font-size: 1.1em;
            color: #ffffff;
            margin-top: 14px;
            letter-spacing: 3px;
        }

        .lang-selector {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .lang-selector label {
            color: #FFD700;
            font-weight: 700;
            font-size: 0.85em;
            letter-spacing: 2px;
        }
        .lang-selector select {
            flex: 1;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            background: #1a1a1a;
            color: #ffffff;
            font-size: 0.95em;
            cursor: pointer;
            min-width: 120px;
        }
        .lang-selector select:focus {
            outline: none;
            border-color: #FFD700;
        }
        .lang-selector .lang-flag {
            font-size: 1.4em;
        }

        .date-picker {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .date-picker input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            background: #1a1a1a;
            color: #ffffff;
            font-size: 1em;
            min-width: 150px;
        }
        .date-picker .go-btn {
            padding: 10px 24px;
            background: #FFD700;
            border: none;
            border-radius: 8px;
            color: #000000;
            font-weight: 900;
            cursor: pointer;
        }
        .date-picker .today-btn {
            padding: 10px 16px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            color: #FFD700;
            cursor: pointer;
        }

        .card {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 24px 22px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.08);
        }
        .card-header h2 {
            font-size: 0.85em;
            color: #FFD700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .card-header .badge {
            margin-left: auto;
            background: rgba(255, 215, 0, 0.10);
            padding: 2px 12px;
            border-radius: 20px;
            color: #FFD700;
            font-size: 0.65em;
        }
        .event-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 215, 0, 0.04);
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }
        .event-item:last-child { border-bottom: none; }
        .event-year {
            flex-shrink: 0;
            color: #FFD700;
            font-weight: 900;
            min-width: 58px;
            padding: 2px 10px;
            background: rgba(255, 215, 0, 0.06);
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.08);
        }
        .event-text {
            color: #ffffff;
            font-size: 0.95em;
            line-height: 1.6;
            font-weight: 300;
            flex: 1;
        }
        .event-fav-btn {
            background: none;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            padding: 0 8px;
            color: #555;
        }
        .event-fav-btn.favorited {
            color: #FFD700;
        }
        .event-remove-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 1.2em;
            cursor: pointer;
            padding: 0 8px;
        }

        .fact-card {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 20px 22px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            text-align: center;
        }
        .fact-card .fact-text {
            color: #ffffff;
            font-size: 0.95em;
            line-height: 1.6;
            font-weight: 300;
        }
        .fact-btn {
            margin-top: 12px;
            padding: 8px 20px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            color: #FFD700;
            cursor: pointer;
            font-size: 0.8em;
        }

        .quiz-container {
            margin-top: 16px;
            border-top: 1px solid rgba(255,215,0,0.1);
            padding-top: 16px;
        }
        .quiz-container .quiz-label {
            color: #FFD700;
            font-weight: 700;
            font-size: 0.85em;
            display: block;
            margin-bottom: 10px;
        }
        .quiz-container .quiz-question {
            font-size: 1em;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .quiz-container .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .quiz-container .quiz-options button {
            padding: 10px 12px;
            background: rgba(255,215,0,0.05);
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-family: inherit;
        }
        .quiz-container .quiz-options button:hover {
            background: rgba(255,215,0,0.15);
        }
        .quiz-container .quiz-options button.correct {
            background: rgba(0,255,0,0.2);
            border-color: #00ff00;
        }
        .quiz-container .quiz-options button.wrong {
            background: rgba(255,0,0,0.2);
            border-color: #ff0000;
        }
        .quiz-container .quiz-result {
            margin-top: 10px;
            font-weight: 600;
            font-size: 0.95em;
            min-height: 1.5em;
        }
        .quiz-container .quiz-result.correct { color: #00ff00; }
        .quiz-container .quiz-result.wrong { color: #ff6b6b; }
        .quiz-container .quiz-stats {
            margin-top: 10px;
            font-size: 0.85em;
            color: #FFD700;
            text-align: center;
        }

        .refresh-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: #FFD700;
            border: none;
            border-radius: 50px;
            color: #000000;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 8px;
        }

        .share-section {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .share-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 8px;
            color: #FFD700;
            font-size: 0.85em;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
        }
        .share-btn:hover { background: rgba(255, 215, 0, 0.15); }

        .loading-state {
            text-align: center;
            padding: 50px 20px;
            color: #666666;
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 215, 0, 0.08);
            border-top: 3px solid #FFD700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            color: #333333;
            font-size: 0.7em;
            padding: 30px 0 10px;
            border-top: 1px solid rgba(255, 215, 0, 0.04);
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .header h1 { font-size: 1.6em; }
            .date-picker { flex-direction: column; }
            .date-picker input { width: 100%; }
            .quiz-container .quiz-options {
                grid-template-columns: 1fr 1fr;
            }
            .lang-selector { flex-direction: column; align-items: stretch; }
        }
        @media (max-width: 380px) {
            .quiz-container .quiz-options {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- LANGUAGE SELECTOR -->
        <div class="lang-selector">
            <span class="lang-flag">🌍</span>
            <label for="langSelect">Language</label>

                <option value="hr">🇭🇷 Hrvatski</option>
                <option value="es">🇪🇸 Español</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">
