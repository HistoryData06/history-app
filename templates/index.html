<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>📅 Today in History</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Arial', sans-serif;
            background: #000000;
            min-height: 100vh;
            padding: 20px;
            color: #ffffff;
        }
        .container { max-width: 580px; margin: 0 auto; padding: 10px 0 30px; }

        .header {
            text-align: center;
            padding: 30px 20px 25px;
            margin-bottom: 30px;
            border-bottom: 3px solid #FFD700;
        }
        .header h1 {
            font-size: 2.2em;
            font-weight: 900;
            letter-spacing: 6px;
            color: #FFD700;
            text-transform: uppercase;
        }
        .header .date {
            font-size: 1.1em;
            color: #ffffff;
            margin-top: 14px;
            letter-spacing: 3px;
        }

        .lang-selector {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 12px 20px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .lang-selector label {
            color: #FFD700;
            font-weight: 700;
            font-size: 0.85em;
            letter-spacing: 2px;
        }
        .lang-selector select {
            flex: 1;
            padding: 8px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            background: #1a1a1a;
            color: #ffffff;
            font-size: 0.95em;
            cursor: pointer;
            min-width: 120px;
        }
        .lang-selector select:focus {
            outline: none;
            border-color: #FFD700;
        }
        .lang-selector .lang-flag {
            font-size: 1.4em;
        }

        .view-toggle {
            display: flex;
            gap: 10px;
            margin-bottom: 22px;
        }
        .view-toggle button {
            flex: 1;
            padding: 12px;
            background: rgba(255, 215, 0, 0.05);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 8px;
            color: #888888;
            font-size: 0.85em;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
        }
        .view-toggle button.active {
            background: rgba(255, 215, 0, 0.15);
            border-color: #FFD700;
            color: #FFD700;
        }
        .view-toggle button:hover {
            background: rgba(255, 215, 0, 0.1);
        }

        .calendar-container {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            flex-wrap: wrap;
            gap: 8px;
        }
        .calendar-header .month-year {
            color: #FFD700;
            font-size: 1.1em;
            font-weight: 700;
            letter-spacing: 2px;
        }
        .calendar-header .nav-btn {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            color: #FFD700;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 1em;
            transition: all 0.3s ease;
        }
        .calendar-header .nav-btn:hover {
            background: rgba(255, 215, 0, 0.2);
        }
        .calendar-header .today-btn-cal {
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            color: #FFD700;
            padding: 8px 16px;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s ease;
        }
        .calendar-header .today-btn-cal:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
        }
        .calendar-grid .day-name {
            text-align: center;
            color: #888888;
            font-size: 0.7em;
            padding: 6px 0;
            font-weight: 700;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        .calendar-grid .day-cell {
            text-align: center;
            padding: 8px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 0.9em;
            color: #888888;
            position: relative;
        }
        .calendar-grid .day-cell:hover {
            background: rgba(255, 215, 0, 0.1);
        }
        .calendar-grid .day-cell.has-events {
            color: #ffffff;
            font-weight: 700;
        }
        .calendar-grid .day-cell.has-events::after {
            content: '';
            position: absolute;
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #FFD700;
        }
        .calendar-grid .day-cell.today {
            background: rgba(255, 215, 0, 0.15);
            border: 1px solid rgba(255, 215, 0, 0.2);
            color: #FFD700;
            font-weight: 900;
        }
        .calendar-grid .day-cell.selected {
            background: #FFD700;
            color: #000000;
            font-weight: 900;
        }
        .calendar-grid .day-cell.selected::after {
            background: #000000;
        }
        .calendar-grid .day-cell.other-month {
            color: #333333;
        }

        .calendar-legend {
            display: flex;
            gap: 16px;
            justify-content: center;
            margin-top: 12px;
            font-size: 0.7em;
            color: #888888;
        }
        .calendar-legend span {
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .calendar-legend .dot {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #FFD700;
        }
        .calendar-legend .dot.gray {
            background: #555555;
        }

        .date-picker {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 18px 20px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }
        .date-picker input {
            flex: 1;
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid rgba(255, 215, 0, 0.2);
            background: #1a1a1a;
            color: #ffffff;
            font-size: 1em;
            min-width: 150px;
        }
        .date-picker input:focus {
            outline: none;
            border-color: #FFD700;
        }
        .date-picker .go-btn {
            padding: 10px 24px;
            background: #FFD700;
            border: none;
            border-radius: 8px;
            color: #000000;
            font-weight: 900;
            cursor: pointer;
        }
        .date-picker .go-btn:hover {
            background: #FFE44D;
        }
        .date-picker .today-btn {
            padding: 10px 16px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 8px;
            color: #FFD700;
            cursor: pointer;
        }
        .date-picker .today-btn:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        .card {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 24px 22px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 215, 0, 0.15);
        }
        .card-header {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(255, 215, 0, 0.08);
        }
        .card-header h2 {
            font-size: 0.85em;
            color: #FFD700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }
        .card-header .badge {
            margin-left: auto;
            background: rgba(255, 215, 0, 0.10);
            padding: 2px 12px;
            border-radius: 20px;
            color: #FFD700;
            font-size: 0.65em;
        }
        .event-item {
            padding: 12px 0;
            border-bottom: 1px solid rgba(255, 215, 0, 0.04);
            display: flex;
            gap: 14px;
            align-items: flex-start;
        }
        .event-item:last-child { border-bottom: none; }
        .event-year {
            flex-shrink: 0;
            color: #FFD700;
            font-weight: 900;
            min-width: 58px;
            padding: 2px 10px;
            background: rgba(255, 215, 0, 0.06);
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 215, 0, 0.08);
        }
        .event-text {
            color: #ffffff;
            font-size: 0.95em;
            line-height: 1.6;
            font-weight: 300;
            flex: 1;
        }
        .event-fav-btn {
            background: none;
            border: none;
            font-size: 1.2em;
            cursor: pointer;
            padding: 0 8px;
            color: #555;
        }
        .event-fav-btn.favorited {
            color: #FFD700;
        }
        .event-remove-btn {
            background: none;
            border: none;
            color: #ff6b6b;
            font-size: 1.2em;
            cursor: pointer;
            padding: 0 8px;
        }

        .fact-card {
            background: #0a0a0a;
            border-radius: 12px;
            padding: 20px 22px;
            margin-bottom: 22px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            text-align: center;
        }
        .fact-card .fact-text {
            color: #ffffff;
            font-size: 0.95em;
            line-height: 1.6;
            font-weight: 300;
        }
        .fact-btn {
            margin-top: 12px;
            padding: 8px 20px;
            background: rgba(255, 215, 0, 0.1);
            border: 1px solid rgba(255, 215, 0, 0.2);
            border-radius: 20px;
            color: #FFD700;
            cursor: pointer;
            font-size: 0.8em;
            transition: all 0.3s ease;
        }
        .fact-btn:hover {
            background: rgba(255, 215, 0, 0.2);
        }

        .quiz-container {
            margin-top: 16px;
            border-top: 1px solid rgba(255,215,0,0.1);
            padding-top: 16px;
        }
        .quiz-container .quiz-label {
            color: #FFD700;
            font-weight: 700;
            font-size: 0.85em;
            display: block;
            margin-bottom: 10px;
        }
        .quiz-container .quiz-question {
            font-size: 1em;
            color: #ffffff;
            margin-bottom: 10px;
        }
        .quiz-container .quiz-options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }
        .quiz-container .quiz-options button {
            padding: 10px 12px;
            background: rgba(255,215,0,0.05);
            border: 1px solid rgba(255,215,0,0.15);
            border-radius: 8px;
            color: #ffffff;
            font-size: 0.8em;
            cursor: pointer;
            transition: all 0.2s ease;
            text-align: left;
            font-family: inherit;
        }
        .quiz-container .quiz-options button:hover {
            background: rgba(255,215,0,0.15);
        }
        .quiz-container .quiz-options button.correct {
            background: rgba(0,255,0,0.2);
            border-color: #00ff00;
        }
        .quiz-container .quiz-options button.wrong {
            background: rgba(255,0,0,0.2);
            border-color: #ff0000;
        }
        .quiz-container .quiz-result {
            margin-top: 10px;
            font-weight: 600;
            font-size: 0.95em;
            min-height: 1.5em;
        }
        .quiz-container .quiz-result.correct { color: #00ff00; }
        .quiz-container .quiz-result.wrong { color: #ff6b6b; }
        .quiz-container .quiz-stats {
            margin-top: 10px;
            font-size: 0.85em;
            color: #FFD700;
            text-align: center;
        }

        .refresh-btn {
            display: block;
            width: 100%;
            padding: 18px;
            background: #FFD700;
            border: none;
            border-radius: 50px;
            color: #000000;
            font-weight: 900;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 4px;
            margin-top: 8px;
            transition: all 0.3s ease;
        }
        .refresh-btn:hover {
            background: #FFE44D;
            transform: translateY(-2px);
        }
        .refresh-btn:active {
            transform: scale(0.97);
        }

        .share-section {
            display: flex;
            gap: 10px;
            margin-top: 8px;
        }
        .share-btn {
            flex: 1;
            padding: 12px;
            background: rgba(255, 215, 0, 0.08);
            border: 1px solid rgba(255, 215, 0, 0.15);
            border-radius: 8px;
            color: #FFD700;
            font-size: 0.85em;
            cursor: pointer;
            text-align: center;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .share-btn:hover { background: rgba(255, 215, 0, 0.15); }

        .loading-state {
            text-align: center;
            padding: 50px 20px;
            color: #666666;
        }
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(255, 215, 0, 0.08);
            border-top: 3px solid #FFD700;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin-bottom: 16px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .footer {
            text-align: center;
            color: #333333;
            font-size: 0.7em;
            padding: 30px 0 10px;
            border-top: 1px solid rgba(255, 215, 0, 0.04);
            margin-top: 10px;
        }

        @media (max-width: 480px) {
            body { padding: 12px; }
            .header h1 { font-size: 1.6em; }
            .date-picker { flex-direction: column; }
            .date-picker input { width: 100%; }
            .quiz-container .quiz-options { grid-template-columns: 1fr 1fr; }
            .lang-selector { flex-direction: column; align-items: stretch; }
            .calendar-grid .day-cell { padding: 6px 0; font-size: 0.8em; }
            .calendar-header .month-year { font-size: 0.9em; }
            .calendar-header .nav-btn { padding: 6px 12px; font-size: 0.8em; }
        }
        @media (max-width: 380px) {
            .quiz-container .quiz-options { grid-template-columns: 1fr; }
            .calendar-grid .day-cell { padding: 4px 0; font-size: 0.7em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="lang-selector">
            <span class="lang-flag">🌍</span>
            <label for="langSelect">Language</label>
            <select id="langSelect" onchange="changeLanguage(this.value)">
                <option value="en">🇬🇧 English</option>
                <option value="hr">🇭🇷 Hrvatski</option>
                <option value="es">🇪🇸 Español</option>
                <option value="de">🇩🇪 Deutsch</option>
                <option value="fr">🇫🇷 Français</option>
                <option value="it">🇮🇹 Italiano</option>
                <option value="pt">🇵🇹 Português</option>
                <option value="ru">🇷🇺 Русский</option>
                <option value="ja">🇯🇵 日本語</option>
                <option value="zh">🇨🇳 中文</option>
            </select>
        </div>

        <div class="header">
            <h1 id="appTitle">📜 Today in History</h1>
            <div class="date" id="headerDate">Loading...</div>
        </div>

        <div class="view-toggle">
            <button id="listViewBtn" class="active" onclick="setView('list')">📋 List</button>
            <button id="calendarViewBtn" onclick="setView('calendar')">📅 Calendar</button>
        </div>

        <div id="calendarView" style="display:none;">
            <div class="calendar-container">
                <div class="calendar-header">
                    <button class="nav-btn" onclick="changeMonth(-1)">◀</button>
                    <span class="month-year" id="calendarTitle">January 2026</span>
                    <button class="nav-btn" onclick="changeMonth(1)">▶</button>
                    <button class="today-btn-cal" onclick="goTodayCalendar()">Today</button>
                </div>
                <div class="calendar-grid" id="calendarGrid"></div>
                <div class="calendar-legend">
                    <span><span class="dot"></span> Has events</span>
                    <span><span class="dot gray"></span> No events</span>
                </div>
            </div>
        </div>

        <div id="listView">
            <div class="date-picker">
                <label id="dateLabel">📅 Date</label>
                <input type="date" id="dateInput">
                <button class="go-btn" id="goBtn" onclick="goToDate()">Go</button>
                <button class="today-btn" id="todayBtn" onclick="goToday()">Today</button>
            </div>
        </div>

        <div class="fact-card">
            <div class="fact-text" id="factText">Click for a random fact!</div>
            <button class="fact-btn" id="randomBtn" onclick="getRandomFact()">🎲 Random Fact</button>
            <div class="quiz-container">
                <span class="quiz-label" id="quizLabel">📝 QUIZ TIME</span>
                <div class="quiz-question" id="quizQuestion">Ready to test your history knowledge?</div>
                <div class="quiz-options" id="quizOptions"></div>
                <div class="quiz-result" id="quizResult"></div>
                <div class="quiz-stats" id="quizStats">🏆 Quiz Score: 0</div>
                <button class="fact-btn" id="quizNewBtn" onclick="generateQuiz()" style="margin-top:8px;">📚 New Quiz</button>
            </div>
        </div>

        <div class="card" id="favoritesCard" style="display:none;">
            <div class="card-header">
                <h2 id="favoritesLabel">⭐ Favorites</h2>
                <span class="badge" id="favCount">0</span>
            </div>
            <div id="favoritesList"></div>
        </div>

        <div id="content">
            <div class="loading-state">
                <div class="spinner"></div>
                <p id="loadingText">Loading history...</p>
            </div>
        </div>

        <div class="share-section">
            <button class="share-btn" id="shareAllBtn" onclick="shareAll()">📤 Share All</button>
            <button class="share-btn" id="shareTodayBtn" onclick="shareToday()">📅 Share Today</button>
        </div>

        <button class="refresh-btn" id="refreshBtn" onclick="loadEvents()">⟳ Refresh</button>

        <div class="footer" id="footerText">Built with ❤️ • Wikipedia</div>
    </div>

    <script>
        let currentLang = localStorage.getItem('historyLang') || 'en';
        let translations = {};
        let currentEvents = [];
        let favorites = JSON.parse(localStorage.getItem('historyFavorites') || '[]');
        let currentView = 'list';
        let calendarMonth = new Date().getMonth();
        let calendarYear = new Date().getFullYear();
        let calendarData = {};

        function generateCalendarData() {
            const today = new Date();
            const year = today.getFullYear();
            const month = today.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            calendarData = {};
            const sampleDates = [1, 3, 5, 8, 12, 15, 18, 20, 22, 25, 27, 28, 30];
            sampleDates.forEach(day => {
                if (day <= daysInMonth) {
                    const dateKey = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(day).padStart(2, '0');
                    calendarData[dateKey] = true;
                }
            });
            const todayKey = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(today.getDate()).padStart(2, '0');
            calendarData[todayKey] = true;
        }

        async function loadTranslations() {
            try {
                const response = await fetch('/api/languages');
                const data = await response.json();
                translations = data;
            } catch (e) {
                console.error('Error loading translations:', e);
            }
        }

        function changeLanguage(lang) {
            currentLang = lang;
            localStorage.setItem('historyLang', lang);
            document.getElementById('langSelect').value = lang;
            updateUI();
            loadEvents();
        }

        function getText(key) {
            if (translations[currentLang] && translations[currentLang][key]) return translations[currentLang][key];
            if (translations['en'] && translations['en'][key]) return translations['en'][key];
            return key;
        }

        function updateUI() {
            document.getElementById('appTitle').textContent = getText('app_title');
            document.getElementById('dateLabel').textContent = getText('date_label');
            document.getElementById('goBtn').textContent = getText('go_btn');
            document.getElementById('todayBtn').textContent = getText('today_btn');
            document.getElementById('randomBtn').innerHTML = getText('random_btn');
            document.getElementById('quizLabel').textContent = getText('quiz_label');
            document.getElementById('quizNewBtn').textContent = getText('quiz_new');
            document.getElementById('favoritesLabel').textContent = getText('favorites_label');
            document.getElementById('shareAllBtn').textContent = getText('share_all');
            document.getElementById('shareTodayBtn').textContent = getText('share_today');
            document.getElementById('refreshBtn').textContent = getText('refresh_btn');
            document.getElementById('footerText').textContent = getText('footer');
            document.getElementById('loadingText').textContent = getText('loading');
        }

        function setView(view) {
            currentView = view;
            document.getElementById('listViewBtn').className = view === 'list' ? 'active' : '';
            document.getElementById('calendarViewBtn').className = view === 'calendar' ? 'active' : '';
            document.getElementById('listView').style.display = view === 'list' ? 'block' : 'none';
            document.getElementById('calendarView').style.display = view === 'calendar' ? 'block' : 'none';
            if (view === 'calendar') renderCalendar(calendarMonth, calendarYear);
        }

        function renderCalendar(month, year) {
            const today = new Date();
            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();
            const daysInPrevMonth = new Date(year, month, 0).getDate();
            const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
            document.getElementById('calendarTitle').textContent = monthNames[month] + ' ' + year;
            
            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';
            ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'].forEach(name => {
                let d = document.createElement('div');
                d.className = 'day-name';
                d.textContent = name;
                grid.appendChild(d);
            });

            let startDay = firstDay === 0 ? 6 : firstDay - 1;
            for (let i = startDay - 1; i >= 0; i--) {
                let d = document.createElement('div');
                d.className = 'day-cell other-month';
                d.textContent = daysInPrevMonth - i;
                grid.appendChild(d);
            }

            let selectedDate = getDateFromInput();
            for (let i = 1; i <= daysInMonth; i++) {
                let d = document.createElement('div');
                d.className = 'day-cell';
                d.textContent = i;
                const dateKey = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(i).padStart(2, '0');
                if (calendarData[dateKey]) d.classList.add('has-events');
                if (year === today.getFullYear() && month === today.getMonth() && i === today.getDate()) d.classList.add('today');
                if (year === selectedDate.getFullYear() && month === selectedDate.getMonth() && i === selectedDate.getDate()) d.classList.add('selected');
                d.onclick = function() {
                    let newDate = new Date(year, month, i);
                    document.getElementById('dateInput').value = year + '-' + String(month + 1).padStart(2, '0') + '-' + String(i).padStart(2, '0');
                    setView('list');
                    loadEvents();
                };
                grid.appendChild(d);
            }

            let totalCells = startDay + daysInMonth;
            let remainingCells = 42 - totalCells;
            for (let i = 1; i <= remainingCells; i++) {
                let d = document.createElement('div');
                d.className = 'day-cell other-month';
                d.textContent = i;
                grid.appendChild(d);
            }
        }

        function changeMonth(delta) {
            calendarMonth += delta;
            if (calendarMonth > 11) { calendarMonth = 0; calendarYear++; }
            else if (calendarMonth < 0) { calendarMonth = 11; calendarYear--; }
            renderCalendar(calendarMonth, calendarYear);
        }

        function goTodayCalendar() {
            let today = new Date();
            calendarMonth = today.getMonth();
            calendarYear = today.getFullYear();
            renderCalendar(calendarMonth, calendarYear);
        }

        function formatDate(date) {
            return date.toLocaleDateString('en-US', { month: 'long', day: 'numeric', year: 'numeric' });
        }

        function getDateFromInput() {
            let val = document.getElementById('dateInput').value;
            if (val) { let parts = val.split('-'); return new Date(parseInt(parts[0]), parseInt(parts[1]) - 1, parseInt(parts[2])); }
            return new Date();
        }

        function isFavorited(year, text) {
            return favorites.some(f => f.year === year && f.text === text);
        }

        function toggleFavorite(year, text, type) {
            let index = favorites.findIndex(f => f.year === year && f.text === text);
            if (index > -1) favorites.splice(index, 1);
            else favorites.push({ year, text, type, date: new Date().toISOString() });
            localStorage.setItem('historyFavorites', JSON.stringify(favorites));
            renderFavorites();
            loadEvents();
        }

        function renderFavorites() {
            let card = document.getElementById('favoritesCard');
            let list = document.getElementById('favoritesList');
            let count = document.getElementById('favCount');
            if (favorites.length === 0) { card.style.display = 'none'; return; }
            card.style.display = 'block';
            count.textContent = favorites.length;
            let html = '';
            favorites.forEach(f => {
                html += `<div class="event-item"><span class="event-year">${f.year}</span><span class="event-text">${f.text}</span><button class="event-remove-btn" onclick="removeFavorite('${f.year}', '${f.text.replace(/'/g, "\\'")}')">✕</button></div>`;
            });
            list.innerHTML = html;
        }

        function removeFavorite(year, text) {
            favorites = favorites.filter(f => !(f.year === year && f.text === text));
            localStorage.setItem('historyFavorites', JSON.stringify(favorites));
            renderFavorites();
            loadEvents();
        }
